name: Deploy to Production

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false    # never cancel an active deploy

env:
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/afridev

jobs:
  # ── Build & Push Docker Images ──────────────────────────────────────────────
  build-images:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      api-image: ${{ steps.meta-api.outputs.tags }}
      web-image: ${{ steps.meta-web.outputs.tags }}
      sha-short: ${{ steps.sha.outputs.short }}

    steps:
      - uses: actions/checkout@v4

      - name: Short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── API image ──
      - name: Docker meta — API
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-api
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build & push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/api.Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_VERSION=${{ env.NODE_VERSION }}

      # ── Web image ──
      - name: Docker meta — Web
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-web
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build & push Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/web.Dockerfile
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy to OVH VPS ───────────────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-images
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Write SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Copy docker-compose.prod.yml
        run: |
          scp -i ~/.ssh/deploy_key \
            docker-compose.prod.yml \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/afridev/docker-compose.prod.yml

      - name: Deploy on VPS
        env:
          SHA_SHORT: ${{ needs.build-images.outputs.sha-short }}
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'ENDSSH'
            set -e
            cd /opt/afridev

            # Pull latest images
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ghcr.io/${{ github.repository_owner }}/afridev-api:latest
            docker pull ghcr.io/${{ github.repository_owner }}/afridev-web:latest

            # Apply env overrides (secrets injected via GitHub environment)
            export DATABASE_URL="${{ secrets.DATABASE_URL }}"
            export REDIS_URL="${{ secrets.REDIS_URL }}"
            export JWT_SECRET="${{ secrets.JWT_SECRET }}"
            export JWT_REFRESH_SECRET="${{ secrets.JWT_REFRESH_SECRET }}"
            export GITHUB_CLIENT_ID="${{ secrets.OAUTH_GITHUB_CLIENT_ID }}"
            export GITHUB_CLIENT_SECRET="${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}"
            export WAVE_API_KEY="${{ secrets.WAVE_API_KEY }}"
            export WAVE_WEBHOOK_SECRET="${{ secrets.WAVE_WEBHOOK_SECRET }}"
            export STRIPE_SECRET_KEY="${{ secrets.STRIPE_SECRET_KEY }}"
            export STRIPE_WEBHOOK_SECRET="${{ secrets.STRIPE_WEBHOOK_SECRET }}"
            export RESEND_API_KEY="${{ secrets.RESEND_API_KEY }}"
            export S3_ENDPOINT="${{ secrets.S3_ENDPOINT }}"
            export S3_ACCESS_KEY_ID="${{ secrets.S3_ACCESS_KEY_ID }}"
            export S3_SECRET_ACCESS_KEY="${{ secrets.S3_SECRET_ACCESS_KEY }}"
            export S3_BUCKET="${{ secrets.S3_BUCKET }}"
            export SHA_TAG="${{ env.SHA_SHORT }}"

            # Rolling restart (zero-downtime)
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Run migrations
            docker compose -f docker-compose.prod.yml exec -T api npx prisma migrate deploy

            # Health check
            sleep 10
            docker compose -f docker-compose.prod.yml ps
            curl -sf http://localhost/api/health || (echo "Health check FAILED" && exit 1)

            # Prune old images
            docker image prune -f --filter "until=24h"
          ENDSSH

      - name: Notify success
        if: success()
        run: |
          echo "✅ AfriDev Hub deployed successfully — sha=${{ needs.build-images.outputs.sha-short }}"

      - name: Notify failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ Déploiement échoué — vérifier les logs GitHub Actions.'
            })

  # ── Post-deploy smoke test ───────────────────────────────────────────────────
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: API health
        run: |
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://${{ secrets.PRODUCTION_DOMAIN }}/api/health)
            if [ "$STATUS" = "200" ]; then
              echo "✅ API healthy (attempt $i)"
              exit 0
            fi
            echo "⏳ Attempt $i failed (status $STATUS), retrying in 10s…"
            sleep 10
          done
          echo "❌ API not healthy after 5 attempts"
          exit 1

      - name: Web reachability
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://${{ secrets.PRODUCTION_DOMAIN }})
          if [ "$STATUS" = "200" ]; then
            echo "✅ Web app reachable"
          else
            echo "❌ Web app returned $STATUS"
            exit 1
          fi
