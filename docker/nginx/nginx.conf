# AfriDev Hub — Production Nginx reverse proxy
# Handles: TLS termination (via Certbot), API proxy, Angular SSR, WebSocket upgrade

user nginx;
worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
  worker_connections 1024;
  use epoll;
  multi_accept on;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # ── Logging ─────────────────────────────────────────────────────────────────
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for" '
                  'rt=$request_time uct=$upstream_connect_time uht=$upstream_header_time urt=$upstream_response_time';

  access_log /var/log/nginx/access.log main;

  # ── Performance ──────────────────────────────────────────────────────────────
  sendfile           on;
  tcp_nopush         on;
  tcp_nodelay        on;
  keepalive_timeout  65;
  types_hash_max_size 4096;
  server_tokens      off;
  client_max_body_size 20M;

  # ── Gzip ─────────────────────────────────────────────────────────────────────
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types
    text/plain text/css text/xml text/javascript
    application/json application/javascript application/xml
    application/rss+xml application/atom+xml
    image/svg+xml font/woff font/woff2;

  # ── Rate limiting ─────────────────────────────────────────────────────────────
  limit_req_zone  $binary_remote_addr zone=api_limit:10m rate=60r/m;
  limit_req_zone  $binary_remote_addr zone=auth_limit:10m rate=10r/m;
  limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

  # ── Upstream definitions ─────────────────────────────────────────────────────
  upstream api_backend {
    server api:3000;
    keepalive 32;
  }

  upstream web_backend {
    server web:4000;
    keepalive 16;
  }

  # ── HTTP → HTTPS redirect ────────────────────────────────────────────────────
  server {
    listen 80;
    listen [::]:80;
    server_name afridevhub.com www.afridevhub.com;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ── HTTPS main server ────────────────────────────────────────────────────────
  server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name afridevhub.com www.afridevhub.com;

    # TLS (managed by Certbot / Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/afridevhub.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/afridevhub.com/privkey.pem;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # HSTS
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Security headers
    add_header X-Frame-Options          "SAMEORIGIN"   always;
    add_header X-Content-Type-Options   "nosniff"      always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "camera=(), microphone=(), geolocation=()" always;

    # ── API proxy ──────────────────────────────────────────────────────────────
    location /api/ {
      limit_req zone=api_limit burst=20 nodelay;
      limit_conn conn_limit 10;

      proxy_pass         http://api_backend;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_set_header   Connection        "";

      proxy_connect_timeout 5s;
      proxy_send_timeout    30s;
      proxy_read_timeout    30s;

      # Disable buffering for SSE / streaming
      proxy_buffering off;
    }

    # ── Auth routes (stricter rate limit) ──────────────────────────────────────
    location ~ ^/api/(auth/login|auth/register) {
      limit_req zone=auth_limit burst=5 nodelay;

      proxy_pass         http://api_backend;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── WebSocket — Socket.io notifications ────────────────────────────────────
    location /socket.io/ {
      proxy_pass         http://api_backend;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade    $http_upgrade;
      proxy_set_header   Connection "upgrade";
      proxy_set_header   Host       $host;
      proxy_set_header   X-Real-IP  $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;

      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # ── Swagger UI (disabled in prod by default) ───────────────────────────────
    location /api/docs {
      # Uncomment to allow only internal IPs:
      # allow 10.0.0.0/8;
      # deny all;

      proxy_pass         http://api_backend;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
    }

    # ── Static assets (Angular PWA cache busted filenames) ─────────────────────
    location ~* \.(js|css|woff|woff2|ttf|otf|eot|svg|png|jpg|jpeg|gif|webp|avif|ico)$ {
      proxy_pass         http://web_backend;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;

      expires     1y;
      add_header  Cache-Control "public, immutable";
      access_log  off;
    }

    # ── Service worker (must NOT be cached) ────────────────────────────────────
    location = /ngsw.json {
      proxy_pass         http://web_backend;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      add_header Cache-Control "no-store";
      expires -1;
    }

    location = /ngsw-worker.js {
      proxy_pass         http://web_backend;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      add_header Cache-Control "no-store";
      expires -1;
    }

    # ── Angular SSR — all other routes ─────────────────────────────────────────
    location / {
      proxy_pass         http://web_backend;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_set_header   Connection        "";

      proxy_connect_timeout 5s;
      proxy_read_timeout    15s;

      # Stale-while-revalidate for SSR pages
      proxy_cache_valid 200 1m;
    }

    # ── Health check endpoint (for deploy smoke tests) ─────────────────────────
    location = /health {
      proxy_pass http://api_backend/api/health;
      access_log off;
    }
  }
}
