# Analyse automatique SonarQube Cloud (organisation au plan gratuit, limite de 50 000 lignes).
# Seul le code produit est analysé : l'outillage BMAD versionné sous apps/api, les migrations
# SQL générées et les fichiers de test ne comptent pas dans les lignes du projet.
sonar.sources=apps,libs,prisma
sonar.exclusions=apps/api/.claude/**,apps/api/_bmad/**,apps/api/_bmad-output/**,prisma/migrations/**,**/*.spec.ts,**/node_modules/**,**/dist/**
sonar.tests=apps,libs
sonar.test.inclusions=**/*.spec.ts
sonar.test.exclusions=apps/api/.claude/**,apps/api/_bmad/**,**/node_modules/**
