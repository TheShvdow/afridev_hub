# tickets.toml — epic-front-phase1 (E7)
# Interfaces web Phase 1 alignées sur l'API. Les stories 1 à 9 ont été livrées directement, hors ticket,
# sur la branche feat/import-front (PR #13) : chaque description renvoie aux commits et le plan porte le statut done.
# Build order : 10 (données) puis 11 à 20 en parallèle, 21 (refactor sweep), 22 (bout en bout).
# Tracer bullet : story 3, offres d'emploi — chemin complet écran, API, base.

[[entry]]
id = 1
type = "story"
title = "Page Mon compte : conditions du badge vérifié"
description = """
Pays, niveau, stack et bio ≥ 50 caractères modifiables depuis Mon compte avec la liste des conditions du badge ; GET /users/:username renvoie pays, stack et niveau. Commits c9411a9 et 27c66fb.
"""
verify = "Un membre remplit les cinq conditions depuis la page et voit le badge attribué."
covers = ["CAP-2"]
after = ["2.8"]
hitl = false
risk = "low"

