puis vérifie le tracer bullet E2 bout en bout.

CHANGEMENTS SCHÉMA (schema.prisma) :
  User  → ajouter : displayName String?, location String?, githubUsername String?, \
          linkedinUsername String?, twitterUsername String?, lastSeenAt DateTime? ; \
          renommer relation : userBadges → receivedBadges (nom Prisma seulement, \
          pas de DDL — ajouter @relation("ReceivedBadges") sur User et UserBadge)
  Badge → ajouter : slug String @unique, category String?, requiredPoints Int @default(0)
  Notification → renommer colonnes : entityType → targetType, entityId → targetId ; \
                 ajouter : title String?, actorId String?, readAt DateTime? ; \
                 ajouter relation : actor User? @relation("NotificationActor", ...)
  User  → ajouter relation NotificationsSent Notification[] @relation("NotificationActor")
  NotificationType enum → ajouter valeur : BADGE_AWARDED

CORRECTIONS CODE (sans DDL supplémentaire) :
  gamification.service.ts : remplacer sourceId par entityId dans l'interface \
    ReputationEvent et dans prisma.reputationEvent.create()
  notifications.service.ts : changer UPVOTE → VOTE_RECEIVED dans notifyUpvote()
  auth.service.ts : retirer l'update lastSeenAt (champ existera après migration, \
