[[entry]]
id = 2
type = "story"
title = "Vérification email — VerificationToken flow"
description = """
Ajoute la confirmation d'email à l'inscription : le token est créé en DB, \
l'email est envoyé via MailService, et un endpoint permet de valider ou de renvoyer.

SCOPE :
  AuthService.sendVerificationEmail(userId, email) :
    - génère token = uuid() + expiry = now + 24h
    - insère dans VerificationToken { identifier: email, token, expires }
    - appelle mailService.send() avec lien /auth/verify-email?token=<tok>
  POST /auth/verify-email?token= :
    - cherche VerificationToken by token, vérifie expires > now
    - met isVerified = true sur User (email = identifier)
    - supprime le token utilisé
    - retourne { message: 'Email vérifié.' }
  POST /auth/resend-verification (guard JwtAuthGuard) :
    - supprime les anciens tokens de cet email
    - appelle sendVerificationEmail
    - retourne { message: 'Email de vérification renvoyé.' }
  AuthService.register() : appelle sendVerificationEmail après création user.
  Login ne bloque PAS si !isVerified (soft gate Phase 1).
"""
verify = """
POST /auth/register → email de vérification loggué en console (sandbox mode).
POST /auth/verify-email?token=<valid> → 200 { message } ; User.isVerified = true en DB.
POST /auth/verify-email?token=<expired> → 400.
POST /auth/resend-verification (token valide) → 200 { message }.
nx test api --testPathPattern=auth passe (unit test mock MailService).
"""
covers = ["CAP-2"]
after = [1]
hitl = false
risk = "medium"
notes = [
  "VerificationToken.identifier = email (pas userId), conforme au modèle NextAuth hérité.",
  "En sandbox (NODE_ENV != production), MailService.send() logue au lieu d'appeler Resend — aucune clé API requise.",
]

