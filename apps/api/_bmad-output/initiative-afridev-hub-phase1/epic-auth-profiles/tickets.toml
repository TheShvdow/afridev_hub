# tickets.toml — epic-auth-profiles (E2)
# Authentification & Profils — 11 stories en build order.
# Tracer bullet : inscription → login → GET /users/:username retourne profil public
#                 avec reputation: 0 — prouve JWT, Prisma User, OG meta bout en bout.
#
# Contraintes héritées (AGENTS.md) :
#   - Toutes les commandes depuis la racine monorepo, jamais depuis apps/api/
#   - Le client Prisma est généré par `npm install` (script prepare) ; relancer `npm run prisma:generate` après tout changement de schéma
#   - Montants monétaires en unités de base entières (FCFA, XOF), jamais float
#   - JWT access 15 min / refresh 7 j ; le refresh token est enregistré dans Redis (liste blanche par jti)
#   - bcrypt rounds = 12
#
# Pré-requis E2 :
#   - E1 terminé (CI, PrismaModule, RedisModule, MailModule, Config, Docker services)
#   - Schéma géré par migrations Prisma versionnées (prisma/migrations/, baseline 20261014120000_init)
#
# Build order :
#   - Piste principale  : 1 → 2 → 3 → 4
#   - Piste modules     : 1 → 5 → 6 (gamification puis notifications)
#   - Piste upload      : 3 → 7
#   - Piste badge       : 5 → 8
#   - Piste OG          : 6 + 7 + 8 → 9 (profil public complet)
#   - Fermeture         : 9 → 10 (refactor) → 11 (smoke test)

