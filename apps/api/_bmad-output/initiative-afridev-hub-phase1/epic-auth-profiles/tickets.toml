[[entry]]
id = 7
type = "story"
title = "UploadModule — presigned URL R2 pour avatars"
description = """
Crée UploadModule avec un endpoint qui génère une presigned URL Cloudflare R2 \
pour upload direct client→R2. Le serveur NestJS ne proxie pas les bytes.

SCOPE :
  Installer : npm install --save @aws-sdk/client-s3 @aws-sdk/s3-request-presigner
  Env vars (optionnels dans Joi, process crashe uniquement si module utilisé) :
    R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET_NAME, R2_PUBLIC_URL
  UploadService.getAvatarPresignedUrl(userId, mimeType, fileSizeBytes) :
    - valider MIME : image/jpeg | image/png | image/webp | image/gif
    - valider taille : ≤ 5 MB
    - générer objectKey = avatars/{userId}/{uuid}.{ext}
    - créer S3Client avec endpoint https://{R2_ACCOUNT_ID}.r2.cloudflarestorage.com
    - signer PutObjectCommand (expiry 5 min, ContentType, ContentLength)
    - retourner { uploadUrl, publicUrl: R2_PUBLIC_URL + '/' + objectKey }
  Controller : POST /upload/avatar-presign (JwtAuthGuard)
    body: { mimeType: string, fileSizeBytes: number }
    réponse: { uploadUrl, publicUrl }
  PATCH /users/me/avatar : changer le TODO placeholder pour appeler \
    UsersService.updateAvatar(userId, publicUrl) directement (le client a \
    déjà uploadé vers R2 et envoie l'URL publique).
  UploadModule : @Global() non — importé uniquement dans UsersModule et JobsModule (E5).

FALLBACK sandbox :
  Si R2_ACCOUNT_ID est absent, retourner { uploadUrl: 'https://placeholder.upload/', \
  publicUrl: 'https://placeholder.r2.dev/...', warning: 'R2 not configured' }.
"""
verify = """
POST /upload/avatar-presign { mimeType: 'image/jpeg', fileSizeBytes: 100000 } :
  → 200 { uploadUrl: string, publicUrl: string }.
mimeType: 'application/pdf' → 400 Bad Request.
fileSizeBytes: 6000000 → 400 Bad Request.
nx build api sans erreur.
"""
covers = ["CAP-2"]
after = [3]
hitl = false
risk = "medium"
notes = [
  "R2 est compatible AWS S3 SDK — utiliser l'endpoint R2 comme baseEndpoint dans S3Client.",
  "En sandbox sans R2_ACCOUNT_ID, le fallback retourne un warning sans crasher.",
  "PATCH /users/me/avatar reçoit une publicUrl dans le body (pas le fichier brut) — le client upload directement vers R2 puis notifie le serveur.",
]

