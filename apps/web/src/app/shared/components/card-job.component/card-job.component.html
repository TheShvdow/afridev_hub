<article
  (click)="selected.emit(job())"
  class="flex cursor-pointer flex-col rounded-[14px] bg-[#F8FAFC] py-[16px] px-[20px] transition-shadow hover:shadow-md"
>
  <div class="flex items-center gap-[16px]">
    <img [src]="displayLogo" [alt]="job().company" class="size-[50px] shrink-0 rounded-full object-cover" />
    <div class="min-w-0">
      <div class="flex w-max max-w-full flex-wrap items-center gap-2.5">
        <p class="text-[16px] leading-[26px] text-[#64748B]">{{ job().company }}</p>
        @if (job().isNew !== false) {
          <span class="rounded-full bg-[#FBBF24] px-[16px] py-[4px] text-[14px] font-medium leading-[22px] text-[#141219]">Nouveau</span>
        }
      </div>
      <h3 class="text-[20px] font-bold leading-[32px] text-[#141219]">{{ job().title }}</h3>
    </div>
  </div>

  <div class="mt-4 flex flex-wrap items-center gap-[16px]">

      </svg>

    </span>
    <span class="inline-flex items-center gap-[6px] text-[16px] leading-[26px] text-[#64748B]">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path fill-rule="evenodd" clip-rule="evenodd" d="M12 21C13.1819 21 14.3522 20.7672 15.4442 20.3149C16.5361 19.8626 17.5282 19.1997 18.364 18.364C19.1997 17.5282 19.8626 16.5361 20.3149 15.4442C20.7672 14.3522 21 13.1819 21 12C21 10.8181 20.7672 9.64778 20.3149 8.55585C19.8626 7.46392 19.1997 6.47177 18.364 5.63604C17.5282 4.80031 16.5361 4.13738 15.4442 3.68508C14.3522 3.23279 13.1819 3 12 3C9.61305 3 7.32387 3.94821 5.63604 5.63604C3.94821 7.32387 3 9.61305 3 12C3 14.3869 3.94821 16.6761 5.63604 18.364C7.32387 20.0518 9.61305 21 12 21ZM13 6.5C13 6.23478 12.8946 5.98043 12.7071 5.79289C12.5196 5.60536 12.2652 5.5 12 5.5C11.7348 5.5 11.4804 5.60536 11.2929 5.79289C11.1054 5.98043 11 6.23478 11 6.5V11.75C11 12.44 11.56 13 12.25 13H15.5C15.7652 13 16.0196 12.8946 16.2071 12.7071C16.3946 12.5196 16.5 12.2652 16.5 12C16.5 11.7348 16.3946 11.4804 16.2071 11.2929C16.0196 11.1054 15.7652 11 15.5 11H13V6.5Z" fill="#64748B"/>
      </svg>
      {{ job().experience || job().mode || '' }}
    </span>
  </div>

  <div class="mt-4 flex flex-wrap gap-4 border-b border-[#E2E8F0] py-[16px]">
    @for (skill of displaySkills; track skill) {
      <span class="bg-[#F0FDF4] text-[#0F6932] rounded-[1000px] px-[16px] py-[4px] text-[16px] font-medium">{{ skill }}</span>
    }
  </div>

  <div class="mt-auto flex flex-wrap items-end justify-between gap-4 pt-4">
    <div>
      <p class="text-[20px] font-bold leading-[32px] text-[#141219]">{{ displaySalary }}</p>
      <span class="mt-0.5 block text-[18px] leading-[26px] text-[#64748B]">{{ displayPosted }}</span>
    </div>
    <button
      type="button"
      class="text-[16px] font-semibold px-[19px] py-[14px] rounded-full border border-[#141219] text-[#141219]"
    >
      {{ ctaLabel() }}
    </button>
  </div>
</article>
