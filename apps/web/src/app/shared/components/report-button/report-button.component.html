@if (visible()) {
  <button
    type="button"
    (click)="toggle()"
    [disabled]="sent()"
    [attr.aria-expanded]="open()"
    aria-haspopup="dialog"
    [class]="
      dark()
        ? 'rounded-full border border-white/30 px-3 py-1 text-[13px] font-medium text-white transition-colors hover:bg-white/10 disabled:opacity-60'
        : 'rounded-full border border-[#E2E8F0] px-3 py-1 text-[13px] font-medium text-[#64748B] transition-colors hover:border-ink hover:text-ink disabled:opacity-60'
    "
  >
    {{ sent() ? 'Signalé' : 'Signaler' }}
  </button>

  @if (open()) {
    <form
      role="dialog"
      aria-label="Signaler ce contenu"
      [formGroup]="form"
      (ngSubmit)="submit()"
      class="absolute right-0 top-[calc(100%+8px)] z-30 flex w-[300px] flex-col gap-3 rounded-2xl border border-[#E2E8F0] bg-white p-4 text-left shadow-xl"
    >
      <label class="flex flex-col gap-1 text-[14px] font-semibold text-[#141219]">
        Motif
        <select formControlName="reason" class="rounded-xl border border-[#E2E8F0] px-3 py-2 text-[14px] font-normal">
          @for (reason of reasons; track reason.value) {
            <option [value]="reason.value">{{ reason.label }}</option>
          }
        </select>
      </label>
      <label class="flex flex-col gap-1 text-[14px] font-semibold text-[#141219]">
        Précisions (facultatif)
        <textarea
          formControlName="details"
          rows="3"
          [attr.maxlength]="maxLength"
          class="rounded-xl border border-[#E2E8F0] px-3 py-2 text-[14px] font-normal"
        ></textarea>
      </label>

      @if (errorMessage()) {
        <p role="alert" class="text-[13px] font-medium text-[#FB2C36]">{{ errorMessage() }}</p>
      }

      <div class="flex justify-end gap-2">
        <button type="button" (click)="toggle()" class="rounded-full px-3 py-1.5 text-[13px] font-semibold text-[#64748B] hover:text-ink">
          Annuler
        </button>
        <button
          type="submit"
          [disabled]="sending()"
          class="rounded-full bg-ink px-4 py-1.5 text-[13px] font-semibold text-white disabled:opacity-60"
        >
          {{ sending() ? 'Envoi…' : 'Envoyer' }}
        </button>
      </div>
    </form>
  }
}
