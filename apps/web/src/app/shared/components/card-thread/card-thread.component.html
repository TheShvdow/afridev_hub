<article
  (click)="opened.emit(thread())"
  class="flex cursor-pointer items-center gap-4 rounded-2xl transition-colors hover:bg-[#F8FAFC] sm:gap-4 lg:h-[130px]"
>
  <span
    aria-hidden="true"
    class="w-[64px] h-[64px] flex shrink-0 items-center justify-center rounded-full bg-[#0F1011] text-[24px] font-semibold leading-[38px] text-[#FBBF24] sm:w-[64px] sm:h-[64px] lg:w-[80px] lg:h-[80px]"
  >
    {{ thread().initials }}
  </span>
  <div class="min-w-0 flex-1">
    <div class="flex flex-wrap gap-4">
      @for (tag of thread().tags; track tag) {
        @if (tag === thread().tags[0]) {
          <span class="bg-[#F0FDF4] text-[#0F6932] rounded-[1000px] px-[16px] py-[4px] text-[16px] font-medium">{{ tag }}</span>
        } @else {
          <span class="bg-[#FEFCE8] text-[#A16207] rounded-[1000px] px-[16px] py-[4px] text-[16px] font-medium">{{ tag }}</span>
        }
      }
    </div>
    <h3 class="mt-[6px] text-[16px] font-normal leading-[26px] text-[#141219]">{{ thread().title }}</h3>
    <p class="mt-[6px] text-[16px] leading-[26px] text-[#64748B]">{{ thread().meta }}</p>
  </div>
  <div class="hidden shrink-0 flex-col items-center justify-center gap-[6px] rounded-2xl bg-[#F8FAFC] sm:flex py-[4px] px-[10px]">
    <span class="text-[24px] font-semibold leading-[38px] text-[#141219]">{{ thread().votes }}</span>
    <span class="text-[16px] font-normal leading-[26px] text-[#64748B]">votes</span>
  </div>
  <div class="hidden shrink-0 flex-col items-center justify-center gap-[6px] rounded-2xl bg-[#F8FAFC] sm:flex py-[4px] px-[10px]">
    <span class="text-[24px] font-semibold leading-[38px] text-[#141219]">{{ thread().replies }}</span>
    <span class="text-[16px] font-normal leading-[26px] text-[#64748B]">réponses</span>
  </div>
</article>
