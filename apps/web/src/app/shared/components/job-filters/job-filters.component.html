<div class="flex flex-col gap-[16px] lg:flex-row lg:items-center lg:justify-between">
  <div class="flex flex-wrap items-center gap-[12px]">
    <select
      [value]="selectedCountry()"
      (change)="selectedCountry.set($any($event.target).value)"
      aria-label="Filtrer par pays"
      class="rounded-full border border-[#E2E8F0] bg-white px-[16px] py-[4px] text-[16px] font-medium text-[#141219]"
    >
      @for (country of countries(); track country) {
        <option [value]="country">{{ country }}</option>
      }
    </select>
    @for (workType of workTypes(); track workType) {
      <button
        type="button"
        (click)="selectedWorkType.set(workType)"
        [class]="
          (selectedWorkType() === workType
            ? 'bg-[#141219] text-white '
            : 'bg-white text-[#141219] border-[#E2E8F0] ') +
          'rounded-full border px-[16px] py-[4px] text-[16px] font-medium transition-colors'
        "
      >
        {{ workType }}
      </button>
    }
  </div>

  <div class="flex flex-wrap items-center gap-[12px]">
    <span class="text-[16px] font-medium text-[#64748B]">Devise</span>
    @for (currency of currencies(); track currency) {
      <button
        type="button"
        (click)="selectedCurrency.set(currency)"
        [class]="
          (selectedCurrency() === currency
            ? 'bg-[#141219] text-white '
            : 'bg-white text-[#141219] border-[#E2E8F0] ') +
          'rounded-full border px-[16px] py-[4px] text-[16px] font-medium transition-colors'
        "
      >
        {{ currency }}
      </button>
    }
  </div>
</div>
