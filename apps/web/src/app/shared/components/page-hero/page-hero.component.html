<section class="relative overflow-hidden bg-[#0F1011]">

    <div class="relative">
      <img
        src="assets/images/section-heading-bg.png "
        alt=""
        aria-hidden="true"
        class="pointer-events-none absolute left-1/2 top-1/2 z-0 w-[535px] -translate-x-1/2 -translate-y-1/2"
      />
      <p class="text-4xl font-bold leading-[1.6] sm:text-5xl lg:text-[72px] lg:leading-[115px]">{{ title() }}</p>
    </div>
    <span class="mt-2.5 block h-1 w-[290px] max-w-full rounded-full bg-amber-400" aria-hidden="true"></span>
    <p class="mt-6 max-w-[946px] text-base font-medium leading-[29px] lg:text-lg">
      {{ subtitle() }}
    </p>
  </div>
</section>
