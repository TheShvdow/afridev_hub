<app-auth-layout>
  <form
    auth-form
    class="mx-auto flex w-full max-w-[420px] flex-col gap-8"
    (ngSubmit)="submit()"
    novalidate
  >
    <app-auth-close />

    <div class="flex flex-col gap-2.5">
      <h1 class="font-display text-2xl font-bold leading-8 text-ink">Vérifiez votre e-mail</h1>
      <p class="text-sm font-medium leading-[22px] tracking-[0.07px] text-slate-500">
        Nous avons envoyé un code à 6 chiffres à
      </p>
      <p class="text-sm font-medium leading-[22px] tracking-[0.07px] text-ink">{{ email }}.</p>
    </div>

    <div class="flex flex-col gap-2">
      <app-otp-inputs (code)="onCode($event)" />

      @if (invalid()) {
        <p class="text-xs font-medium leading-4 text-[#FB2C36]">
          Saisissez les 6 chiffres du code reçu par e-mail.
        </p>
      }
    </div>

    <button type="submit" class="auth-btn">
      Vérifier et continuer
      <app-icon name="arrow-up-right" class="size-6"></app-icon>
    </button>

    <div class="flex flex-col gap-2.5">
      <button
        type="button"
        class="text-center text-base font-medium leading-[26px] tracking-[0.08px] text-ink transition-opacity hover:opacity-70"
        (click)="resend()"
      >
        Renvoyer le code
      </button>

      <div class="flex flex-wrap items-center justify-center gap-2.5">
        <span class="text-base font-medium leading-[26px] tracking-[0.08px] text-slate-500">
          Vous découvrez AfriDev Hub ?
        </span>
        <a
          routerLink="/inscription"
          class="text-sm font-normal leading-5 text-slate-500 underline-offset-4 transition-colors hover:text-ink hover:underline"
        >
          Créez un compte
        </a>
      </div>
    </div>
  </form>

  <app-auth-side
    auth-panel
    eyebrow="La communauté vous attend"
    title="Rejoindre AfriDev Hub"
    description="Échangez avec des développeurs du continent, partagez vos projets et trouvez les bonnes opportunités."
    [steps]="steps"
  />
</app-auth-layout>
