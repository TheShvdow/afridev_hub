<div class="flex flex-col gap-1">
  <div class="flex items-center justify-between gap-4">
    <div class="flex items-center gap-[25px]">
      @for (bar of [0, 1, 2]; track bar) {
        <span
          class="block w-20 border-t-2 transition-colors"
          [style.borderColor]="bar < score() ? barColor() : '#E2E8F0'"
        ></span>
      }
    </div>

    <span class="text-xs font-medium leading-[19px] tracking-[0.06px] text-slate-500">{{ label() }}</span>
  </div>

  <ul class="flex items-center gap-3">
    @for (check of checks(); track check.label) {
      <li
        class="text-xs font-medium leading-[19px] tracking-[0.06px] transition-colors"
        [class.text-primary]="check.valid"
        [class.text-slate-500]="!check.valid"
      >
        {{ check.label }}
      </li>
    }
  </ul>
</div>
