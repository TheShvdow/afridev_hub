<label class="flex flex-col gap-2">
  <span class="auth-field__label">{{ label() }}</span>

  <span class="auth-field">
    <app-icon name="lock" class="auth-field__icon"></app-icon>

    <input
      class="auth-field__input auth-field__input--with-toggle"
      [class.auth-field__input--invalid]="invalid()"
      [type]="visible() ? 'text' : 'password'"
      [name]="name()"
      [attr.autocomplete]="autocomplete()"
      [placeholder]="placeholder()"
      [value]="value()"
      (input)="onInput($event)"
    />

    @if (required()) {
      <span class="auth-field__required auth-field__required--with-toggle">*</span>
    }

    <button
      type="button"
      class="auth-field__toggle"
      [attr.aria-label]="visible() ? 'Masquer le mot de passe' : 'Afficher le mot de passe'"
      [attr.aria-pressed]="visible()"
      (click)="visible.set(!visible())"
    >
      <app-icon [name]="visible() ? 'eye-off' : 'eye'" class="size-5"></app-icon>
    </button>
  </span>
</label>
