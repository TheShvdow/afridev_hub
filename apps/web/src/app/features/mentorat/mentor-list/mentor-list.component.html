<!-- Hero -->
<app-page-hero
  title="Mentorat"
  subtitle="Réservez une session de mentorat avec des experts africains du logiciel. Backend, mobile, data ou DevOps : trouvez le mentor qui vous fera progresser."
/>

<app-preview-banner feature="Le mentorat" />

<!-- Main section -->
<section class="bg-[#F8FAFC]">
  <div class="mx-auto w-full max-w-[1200px] px-6 py-16 sm:px-10 lg:px-0 lg:py-10">
    <div class="flex flex-col gap-10">
      <!-- Filters -->
      <app-mentor-filters
        [specialties]="specialties"
        [slots]="slots"
        [(selectedSpecialty)]="selectedSpecialty"
        [(selectedSlot)]="selectedSlot"
      />

      <!-- Cards grid -->
      <div class="grid grid-cols-1 gap-8 sm:grid-cols-2 lg:grid-cols-4 lg:gap-[40px]">
        @for (mentor of filteredMentors(); track mentor.name + mentor.role) {
          <app-card-mentor [mentor]="mentor" />
        }
      </div>

      <!-- Empty state -->
      @if (filteredMentors().length === 0) {
        <p class="py-10 text-center text-[16px] text-[#64748B]">
          Aucun mentor ne correspond à ces filtres. Essayez de les modifier.
        </p>
      }

      <!-- Load more -->
      <div class="flex justify-center">
        <button type="button" disabled class="inline-flex h-14 items-center justify-center gap-2.5 rounded-full border border-ink px-5 text-base font-semibold leading-[26px] text-ink disabled:cursor-not-allowed disabled:opacity-50">
          Charger plus
        </button>
      </div>
    </div>
  </div>
</section>
