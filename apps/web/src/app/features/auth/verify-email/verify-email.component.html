<section class="min-h-screen bg-[#0f0f0f] px-4 pb-12 pt-[150px] text-white">
  <div class="mx-auto w-full max-w-md text-center">
    <div class="rounded-2xl border border-white/10 bg-[#1e1e1e]/80 p-8 shadow-lg">
      @if (status() === 'loading') {
        <div
          class="mx-auto h-10 w-10 animate-spin rounded-full border-4 border-white/20 border-t-[#0F6932]"
          role="status"
          aria-label="Vérification en cours"
        ></div>
        <h1 class="mt-6 text-xl font-semibold">Vérification en cours…</h1>
        <p class="mt-2 text-white/70">{{ message() || "Nous vérifions votre adresse email." }}</p>
      }

      @if (status() === 'success') {
        <div class="mx-auto flex h-12 w-12 items-center justify-center rounded-full bg-[#0F6932]/20">
          <svg viewBox="0 0 20 20" fill="currentColor" class="h-6 w-6 text-[#0F6932]">
            <path fill-rule="evenodd" d="M16.704 4.153a.75.75 0 01.143 1.052l-8 10.5a.75.75 0 01-1.127.075l-4.5-4.5a.75.75 0 011.06-1.06l3.894 3.893 7.48-9.817a.75.75 0 011.05-.143z" clip-rule="evenodd" />
          </svg>
        </div>
        <h1 class="mt-6 text-xl font-semibold">Email vérifié</h1>
        <p class="mt-2 text-white/70">{{ message() }}</p>
        <div class="mt-8 flex flex-col gap-3">
          <button
            type="button"
            (click)="goForum()"
            class="w-full rounded-full bg-[#0F6932] px-6 py-3 font-semibold transition hover:bg-[#0F6932]/90"
          >
            Accéder au forum
          </button>
          <button
            type="button"
            (click)="goHome()"
            class="w-full rounded-full border border-white/15 px-6 py-3 font-medium transition hover:border-white/30 hover:bg-white/5"
          >
            Retour à l'accueil
          </button>
        </div>
      }

      @if (status() === 'error') {
        <div class="mx-auto flex h-12 w-12 items-center justify-center rounded-full bg-red-500/10">
          <svg viewBox="0 0 20 20" fill="currentColor" class="h-6 w-6 text-red-400">
            <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-8-5a.75.75 0 01.75.75v4.5a.75.75 0 01-1.5 0v-4.5A.75.75 0 0110 5zm0 10a1 1 0 100-2 1 1 0 000 2z" clip-rule="evenodd" />
          </svg>
        </div>
        <h1 class="mt-6 text-xl font-semibold">Vérification impossible</h1>
        <p class="mt-2 text-sm text-red-400">{{ message() }}</p>
        <div class="mt-8 flex flex-col gap-3">
          @if (canResend()) {
            <button
              type="button"
              (click)="resend()"
              class="w-full rounded-full bg-[#0F6932] px-6 py-3 font-semibold transition hover:bg-[#0F6932]/90"
            >
              Renvoyer l'email de vérification
            </button>
          }
          <button
            type="button"
            (click)="goLogin()"
            class="w-full rounded-full border border-white/15 px-6 py-3 font-medium transition hover:border-white/30 hover:bg-white/5"
          >
            Se connecter
          </button>
          <a routerLink="/auth/register" class="text-sm text-[#0F6932] hover:underline">
            Créer un compte
          </a>
        </div>
      }
    </div>
  </div>
</section>
