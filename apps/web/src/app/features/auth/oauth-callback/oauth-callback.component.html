<section class="min-h-screen bg-[#0f0f0f] px-4 pb-12 pt-[150px] text-white">
  <div class="mx-auto w-full max-w-md text-center">
    @if (!error()) {
      <div
        class="mx-auto h-10 w-10 animate-spin rounded-full border-4 border-white/20 border-t-[#0F6932]"
        role="status"
        aria-label="Connexion en cours"
      ></div>
      <p class="mt-6 text-white/70">Connexion en cours…</p>
    } @else {
      <div class="rounded-2xl border border-white/10 bg-[#1e1e1e]/80 p-6 shadow-lg">
        <h1 class="text-xl font-semibold">Connexion impossible</h1>
        <p class="mt-3 text-sm text-red-400">{{ error() }}</p>
        <a
          routerLink="/auth/login"
          class="mt-6 inline-block rounded-full bg-[#0F6932] px-6 py-3 font-semibold transition hover:bg-[#0F6932]/90"
        >
          Retour à la connexion
        </a>
      </div>
    }
  </div>
</section>
