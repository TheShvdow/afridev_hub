<section class="min-h-screen bg-[#0f0f0f] px-4 pb-12 pt-[150px] text-white">
  <div class="mx-auto w-full max-w-md">
    <div class="mb-8 text-center">
      <h1 class="text-3xl font-bold">Lier votre compte</h1>
      <p class="mt-2 text-white/70">
        Un compte existe déjà pour
        @if (email()) {
          <span class="font-semibold text-white">{{ email() }}</span>
        }
      </p>
    </div>

    <form
      [formGroup]="form"
      (ngSubmit)="submit()"
      class="space-y-6 rounded-2xl border border-white/10 bg-[#1e1e1e]/80 p-6 shadow-lg"
    >
      @if (errorMessage()) {
        <div class="rounded-lg bg-red-500/10 px-4 py-3 text-sm text-red-400">
          {{ errorMessage() }}
        </div>
      }

      <div class="space-y-2">
        <label class="text-sm font-medium text-white/80" for="password">
          Mot de passe de votre compte
        </label>
        <input
          id="password"
          type="password"
          formControlName="password"
          autocomplete="current-password"
          class="w-full rounded-lg border border-white/10 bg-transparent px-4 py-2 text-white outline-none transition focus:border-[#0F6932]"
          placeholder="MotDePasse123!"
        />
        @if (form.controls.password.touched && form.controls.password.invalid) {
          <p class="text-xs text-red-400">Au moins 8 caractères requis</p>
        }
      </div>

      <button
        type="submit"
        [disabled]="loading()"
        class="w-full rounded-full bg-[#0F6932] px-6 py-3 text-base font-semibold transition hover:bg-[#0F6932]/90 disabled:cursor-not-allowed disabled:opacity-60"
      >
        @if (loading()) {
          Liaison en cours...
        } @else {
          Confirmer la liaison
        }
      </button>

      <p class="text-center text-sm text-white/70">
        <a routerLink="/auth/login" class="text-[#0F6932] hover:underline">
          Revenir à la connexion
        </a>
      </p>
    </form>
  </div>
</section>
