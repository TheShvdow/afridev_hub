<section id="projets" class="">
  <div class="mx-auto w-full max-w-[1200px] px-6 py-16 sm:px-10 lg:px-0 lg:pt-10">
    <app-section-heading label="FORMATIONS" />
    <p class="text-[32px] font-bold text-[#141219] lg:mt-[34px]">Apprenez avec les meilleurs</p>

    <div class="mt-10 grid grid-cols-1 gap-8 md:grid-cols-2 lg:mt-[60px] lg:grid-cols-3 lg:gap-10">
      @for (formation of formations; track formation.title) {
        <article class="flex flex-col rounded-[24px] bg-white p-[24px]">
          <div class="relative overflow-hidden rounded-3xl">
            <img [src]="formation.image" [alt]="formation.title" class="h-[200px] w-full object-cover" />            
            </div>
            <p class="mt-[16px] text-base font-medium leading-[28px] text-ink">{{ formation.title }}</p>
            <p class="mt-[16px] text-base font-medium leading-[26px] text-ink">{{ formation.description }}</p>
            <span class="mt-[16px] flex gap-[6px] text-[#FBBF24] px-[8px] py-[4px] bg-[#FEFCE8] rounded-[1000px] text-[14px] font-medium w-fit">
                <svg aria-hidden="true" width="17" height="16" viewBox="0 0 17 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M16.1269 7.17383C16.3127 7.03539 16.4505 6.84226 16.5211 6.62153C16.5916 6.4008 16.5913 6.16352 16.5202 5.94298C16.449 5.72244 16.3107 5.52969 16.1245 5.39175C15.9383 5.25381 15.7136 5.17761 15.4819 5.17383L10.9819 5.00383C10.9597 5.0023 10.9385 4.99441 10.9208 4.9811C10.9031 4.96779 10.8895 4.94964 10.8819 4.92883L9.32687 0.728826C9.24874 0.515146 9.10684 0.330635 8.92038 0.200274C8.73391 0.0699132 8.51189 0 8.28437 0C8.05686 0 7.83484 0.0699132 7.64837 0.200274C7.46191 0.330635 7.32 0.515146 7.24187 0.728826L5.69187 4.94383C5.68421 4.96464 5.6707 4.98279 5.65295 4.9961C5.63521 5.00941 5.614 5.0173 5.59187 5.01883L1.09187 5.18883C0.860176 5.19261 0.635473 5.26881 0.44927 5.40675C0.263068 5.54469 0.124704 5.73744 0.0535785 5.95798C-0.0175465 6.17852 -0.0178656 6.4158 0.0526659 6.63653C0.123197 6.85726 0.261043 7.05039 0.446874 7.18883L3.97687 9.96383C3.99454 9.97773 4.00774 9.9965 4.01485 10.0178C4.02196 10.0392 4.02267 10.0621 4.01687 10.0838L2.80187 14.3888C2.73891 14.608 2.74501 14.8413 2.81934 15.057C2.89367 15.2726 3.03263 15.4601 3.2173 15.594C3.40197 15.7278 3.62339 15.8015 3.85145 15.8051C4.07951 15.8087 4.30312 15.7419 4.49187 15.6138L8.22187 13.1138C8.24025 13.1011 8.26205 13.0943 8.28437 13.0943C8.3067 13.0943 8.3285 13.1011 8.34687 13.1138L12.0769 15.6138C12.2631 15.7462 12.4859 15.8174 12.7144 15.8174C12.9429 15.8174 13.1657 15.7462 13.3519 15.6138C13.5366 15.4812 13.6757 15.2946 13.75 15.0797C13.8243 14.8649 13.8302 14.6322 13.7669 14.4138L12.5419 10.0938C12.5354 10.0721 12.5357 10.049 12.5429 10.0275C12.5501 10.006 12.5637 9.98728 12.5819 9.97383L16.1269 7.17383Z" fill="#FBBF24"/>
                </svg>
                {{ formation.stars }}
            </span>
          <div class="flex justify-between items-center mt-[16px]">
            <p class="mt-4 text-base font-medium leading-[26px] text-slate-500">
              <span class="font-medium text-ink">{{ formation.price }}</span>
            </p>
            <div class="bg-[#0F1011] py-[14px] px-[20px] text-[16px] text-white rounded-[1000px]">
              Voir la formation
            </div>
          </div>

        </article>
      }
    </div>
      <div class="flex justify-center lg:mt-[40px]">
        <a href="#" class="btn-link text-[16px] font-semibold text-[#0F6932] flex gap-[10px]">
          Consulter toutes nos formations
          <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M14.4302 5.92969L20.5002 11.9997L14.4302 18.0697" fill="#0F6932"/>
            <path d="M14.4302 5.92969L20.5002 11.9997L14.4302 18.0697" stroke="#0F6932" stroke-width="1.5" stroke-miterlimit="10" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M3.5 12H20.33" stroke="#0F6932" stroke-width="1.5" stroke-miterlimit="10" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
      </div>
  </div>
</section>
