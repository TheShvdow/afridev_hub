<section id="emplois" class="">
  <div class="mx-auto w-full max-w-[1200px] px-6 py-16 sm:px-10 lg:px-0 lg:pb-[144px] lg:pt-10">
    <app-section-heading label="EMPLOIS" />
    <p class="text-[32px] font-bold text-[#141219] lg:mt-[34px]">Offres d'emploi locales</p>

    <app-job-filters
      class="mt-[24px] lg:mt-[32px]"
      [countries]="countries"
      [workTypes]="workTypes"
      [currencies]="currencies"
      [(selectedCountry)]="selectedCountry"
      [(selectedWorkType)]="selectedWorkType"
      [(selectedCurrency)]="selectedCurrency"
    />

    <div class="mt-10 grid grid-cols-1 gap-8 lg:mt-[60px] lg:grid-cols-2 lg:gap-10">
      @for (job of filteredJobs(); track job.title) {
        <app-card-job [job]="job" (selected)="openJob($event)" />
      }
    </div>
    <div class="flex justify-center lg:mt-[40px]">
      <a routerLink="/jobs" class="btn-link text-[16px] font-semibold text-[#0F6932] flex gap-[10px]">
        Tous les offres
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M14.4302 5.92969L20.5002 11.9997L14.4302 18.0697" fill="#0F6932"/>
          <path d="M14.4302 5.92969L20.5002 11.9997L14.4302 18.0697" stroke="#0F6932" stroke-width="1.5" stroke-miterlimit="10" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M3.5 12H20.33" stroke="#0F6932" stroke-width="1.5" stroke-miterlimit="10" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
    </div>
  </div>
  <app-job-detail-panel [job]="selectedJob()" (closed)="closeJob()" />
</section>
