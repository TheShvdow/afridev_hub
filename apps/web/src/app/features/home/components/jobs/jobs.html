<section id="emplois" class="">
  <div class="mx-auto w-full max-w-[1200px] px-6 py-16 sm:px-10 lg:px-0 lg:pb-[144px] lg:pt-10">
    <app-section-heading label="EMPLOIS" />
    <p class="text-[32px] font-bold text-[#141219] lg:mt-[34px]">Offres d'emploi locales</p>

    <div class="mt-6 flex flex-wrap items-center gap-3 lg:mt-8">
      <a routerLink="/jobs" class="inline-flex h-12 items-center justify-center rounded-full border border-[#141219] px-6 text-[16px] font-semibold text-[#141219]">
        Tous les offres
      </a>
      <a routerLink="/jobs/mine" class="inline-flex h-12 items-center justify-center rounded-full border border-[#141219] px-6 text-[16px] font-semibold text-[#141219]">
        Mes offres
      </a>
      <a routerLink="/jobs/alerts" class="inline-flex h-12 items-center justify-center rounded-full border border-[#141219] px-6 text-[16px] font-semibold text-[#141219]">
        Mes alertes
      </a>
      <a routerLink="/jobs/post" class="inline-flex h-12 items-center justify-center rounded-full bg-[#0F1011] px-6 text-[16px] font-semibold text-white">
        Publier une offre
      </a>
    </div>

    <div class="mt-10 grid grid-cols-1 gap-8 lg:mt-[60px] lg:grid-cols-2 lg:gap-10">
      @for (job of jobs(); track job.id) {
        <app-card-job [job]="job" (selected)="openJob($event)" />
      }
    </div>
  </div>
  <app-job-detail-panel [job]="selectedJob()" (closed)="closeJob()" />
</section>
