<section
  class="relative isolate flex min-h-[100svh] items-center justify-center overflow-hidden bg-night px-5 py-24 text-center text-white sm:min-h-[620px] sm:px-8 lg:min-h-[800px] lg:px-10 lg:py-0"
>
  <!-- Poster toujours présent : fallback mobile / offline PWA / Save-Data -->
  <img
    src="assets/images/hero_img.png"
    alt=""
    aria-hidden="true"
    decoding="async"
    fetchpriority="high"
    class="pointer-events-none absolute inset-0 -z-20 h-full w-full object-cover object-center"
  />

  @if (useVideo()) {
    <video
      #heroVideo
      autoplay
      loop
      muted
      playsinline
      webkit-playsinline
      disablePictureInPicture
      preload="metadata"
      poster="assets/images/hero_img.png"
      aria-hidden="true"
      (error)="onVideoError()"
      class="pointer-events-none absolute inset-0 -z-10 h-full w-full object-cover object-center"
    >
      <source src="assets/images/hero.mp4" type="video/mp4" />
    </video>
  }

  <div class="pointer-events-none absolute inset-0 -z-10 bg-night/40" aria-hidden="true"></div>

  <div class="relative z-10 flex flex-col items-center justify-center gap-[50px]">
    <h1 class="max-w-[980px] text-[min(48px,calc((100vw-40px)/8))] font-bold leading-tight sm:text-[64px] lg:text-[72px]">
      La plateforme d'échange africaine,
      <!-- Un bouton : un clic (ou Entrée, Espace) fait alterner les deux expressions. Elles occupent la même case,
           la plus large fixe la taille et la mise en page ne bouge pas. -->
      <button
        type="button"
        (click)="toggle()"
        title="Cliquer pour changer"
        class="inline-grid cursor-pointer whitespace-nowrap rounded-md text-center align-top font-bold text-[#26a15b] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#26a15b] sm:text-left"
      >
        <span
          class="col-start-1 row-start-1 transition-all duration-700 ease-out motion-reduce:transition-none"
          [class]="swapped() ? 'opacity-0 -translate-y-3' : 'opacity-100 translate-y-0'"
          [attr.aria-hidden]="swapped()"
          >par les devs</span
        >
        <span
          class="col-start-1 row-start-1 transition-all duration-700 ease-out motion-reduce:transition-none"
          [class]="swapped() ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-3'"
          [attr.aria-hidden]="!swapped()"
          >et pour les devs</span
        >
      </button>
    </h1>
    <p class="max-w-[946px] text-[18px] font-medium leading-[26px]">
      Partage tes projets, pose tes questions, trouve un mentor, décroche un job. Une communauté tech pensée pour notre contexte.
    </p>
    <div class="flex flex-col gap-[16px] sm:flex-row sm:gap-[24px]">
      <a
        routerLink="/forum"
        class="btn-nav flex shrink-0 gap-[10px] rounded-[1000px] border border-[#34B36B] px-[19px] py-[14px] text-[16px] font-semibold leading-[26px] text-[#34B36B] transition-colors hover:bg-[#0F6932] hover:text-white"
      >
        Explorer la plateforme
      </a>
      <a
        routerLink="/projets"
        class="btn-nav flex shrink-0 gap-[10px] rounded-[1000px] border border-[#E2E8F033] bg-[#E2E8F033] px-[19px] py-[14px] text-[16px] font-semibold leading-[26px] text-white transition-colors hover:bg-[#0F6932] hover:text-white"
      >
        Voir les projets
        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M17.9999 7.05C17.9999 6.78478 17.8946 6.53043 17.707 6.34289C17.5195 6.15536 17.2652 6.05 16.9999 6.05L8.99994 6C8.73472 6 8.48037 6.10536 8.29283 6.29289C8.1053 6.48043 7.99994 6.73478 7.99994 7C7.99994 7.26522 8.1053 7.51957 8.29283 7.70711C8.48037 7.89464 8.73472 8 8.99994 8H14.5599L6.28994 16.29C6.19621 16.383 6.12182 16.4936 6.07105 16.6154C6.02028 16.7373 5.99414 16.868 5.99414 17C5.99414 17.132 6.02028 17.2627 6.07105 17.3846C6.12182 17.5064 6.19621 17.617 6.28994 17.71C6.3829 17.8037 6.4935 17.8781 6.61536 17.9289C6.73722 17.9797 6.86793 18.0058 6.99994 18.0058C7.13195 18.0058 7.26266 17.9797 7.38452 17.9289C7.50638 17.8781 7.61698 17.8037 7.70994 17.71L15.9999 9.42V15C15.9999 15.2652 16.1053 15.5196 16.2928 15.7071C16.4804 15.8946 16.7347 16 16.9999 16C17.2652 16 17.5195 15.8946 17.707 15.7071C17.8946 15.5196 17.9999 15.2652 17.9999 15V7.05Z"
            fill="white"
          />
        </svg>
      </a>
    </div>
  </div>
</section>
