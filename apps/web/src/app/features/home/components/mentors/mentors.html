<section id="mentorat" class="bg-[#E2E8F0]">
  <div class="mx-auto w-full max-w-[1200px] px-6 py-16 sm:px-10 lg:px-0 lg:pt-10">
    <app-section-heading label="MENTORAT" />
    <p class="text-[32px] font-bold text-[#141219] lg:mt-[34px]">Mentors disponibles</p>

    <div class="mt-10 grid grid-cols-1 gap-8 sm:grid-cols-2 lg:mt-[60px] lg:grid-cols-4 lg:gap-[40px]">
      @for (mentor of mentors; track mentor.name + mentor.role) {
        <app-card-mentor [mentor]="mentor" />
      }
    </div>

    <div class="flex justify-center lg:mt-[40px]">
      <a routerLink="/mentorat" class="btn-link text-[16px] font-semibold text-[#0F6932] flex gap-[10px]">
        Tous les mentors
        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M14.4302 5.92969L20.5002 11.9997L14.4302 18.0697" fill="#0F6932"/>
          <path d="M14.4302 5.92969L20.5002 11.9997L14.4302 18.0697" stroke="#0F6932" stroke-width="1.5" stroke-miterlimit="10" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M3.5 12H20.33" stroke="#0F6932" stroke-width="1.5" stroke-miterlimit="10" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
    </div>
  </div>
</section>
