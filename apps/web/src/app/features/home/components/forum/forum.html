<section id="forum" class="bg-white lg:h-[951px]">
  <div class="mx-auto w-full max-w-[1200px] px-6 py-16 sm:px-10 lg:px-0 lg:pb-[37px] lg:pt-[40px]">
    <app-section-heading label="FORUM" />
    <p class="text-[32px] font-bold text-[#141219] lg:mt-[34px]">Fils actifs</p>

    <app-forum-filters class="mt-[24px] lg:mt-[32px]" [tags]="tags" [(selectedTag)]="selectedTag" />

    <div class="flex flex-col gap-6 lg:mt-[58px] lg:gap-4">
      @for (thread of filteredThreads(); track thread.title) {
        <app-card-thread [thread]="thread" (opened)="openThread($event)" />
      }
    </div>

    <div class="flex justify-center lg:mt-[40px]">
      <a routerLink="/forum" class="btn-link text-[16px] font-semibold text-[#0F6932] flex gap-[10px]">
        Tous les fils
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M14.4302 5.92969L20.5002 11.9997L14.4302 18.0697" fill="#0F6932"/>
          <path d="M14.4302 5.92969L20.5002 11.9997L14.4302 18.0697" stroke="#0F6932" stroke-width="1.5" stroke-miterlimit="10" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M3.5 12H20.33" stroke="#0F6932" stroke-width="1.5" stroke-miterlimit="10" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
    </div>
  </div>

  <app-thread-modal [thread]="selectedThread()" (closed)="closeThread()" />
</section>
