<section class="bg-[#F8FAFC]">
  <div class="mx-auto w-full max-w-[800px] px-6 py-12 sm:px-10 lg:px-0">
    <div class="mb-8 flex items-center justify-between">
      <div>
        <h1 class="text-[32px] font-bold text-[#141219]">Notifications</h1>
        <p class="mt-2 text-[16px] text-[#64748B]">Vos dernières notifications</p>
      </div>
      <button type="button" (click)="markAllRead()" class="text-[16px] font-semibold text-[#0F6932]">Tout marquer comme lu</button>
    </div>

    @if (loading()) {
      <p class="text-[16px] text-[#64748B]">Chargement...</p>
    }

    @if (!loading() && notifications().length === 0) {
      <p class="text-[16px] text-[#64748B]">Aucune notification</p>
    }

    <div class="flex flex-col gap-2">
      @for (n of notifications(); track n.id) {
        <button
          type="button"
          (click)="markRead(n)"
          class="flex w-full flex-col gap-1 rounded-[14px] p-4 text-left shadow-sm"
          [ngClass]="n.readAt ? 'bg-white' : 'bg-[#F0FDF4]'"
        >
          <p class="text-[16px] font-semibold text-[#141219]">{{ n.title }}</p>
          @if (n.body) {
            <p class="text-[14px] text-[#64748B]">{{ n.body }}</p>
          }
          <p class="text-[12px] text-[#94A3B8]">{{ n.createdAt | date:'short' }}</p>
        </button>
      }
    </div>
  </div>
</section>
