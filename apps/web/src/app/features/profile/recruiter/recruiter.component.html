<section class="bg-[#F8FAFC]">
  <div class="mx-auto w-full max-w-[600px] px-6 py-12 sm:px-10 lg:px-0">
    <div class="mb-8">
      <h1 class="text-[32px] font-bold text-[#141219]">Activer mon profil recruteur</h1>
      <p class="mt-2 text-[16px] text-[#64748B]">Permet de publier des offres sur AfriDev Hub</p>
    </div>

    @if (success) {
      <div class="rounded-[14px] bg-white p-8 text-center shadow-sm">
        <h2 class="text-[24px] font-bold text-[#0F6932]">Profil recruteur activé</h2>
        <p class="mt-2 text-[16px] text-[#64748B]">Vous pouvez maintenant publier des offres.</p>
        <button type="button" routerLink="/jobs/post" class="mt-6 inline-flex h-12 items-center justify-center rounded-full bg-[#0F1011] px-6 text-[16px] font-semibold text-white">
          Publier une offre
        </button>
      </div>
    } @else {
      <form (ngSubmit)="submit()" class="flex flex-col gap-6 rounded-[14px] bg-white p-6 shadow-sm sm:p-8">
        <label class="flex flex-col gap-2">
          <span class="text-[14px] font-medium text-[#141219]">Nom de l'entreprise</span>
          <input [(ngModel)]="companyName" name="companyName" class="h-12 rounded-lg border border-[#E2E8F0] px-3 text-[16px]" placeholder="TechStartup Dakar" />
        </label>

        @if (error) {
          <p class="text-[14px] text-red-600">{{ error }}</p>
        }

        <div class="flex justify-end">
          <button type="submit" [disabled]="loading" class="inline-flex h-12 items-center justify-center rounded-full bg-[#0F1011] px-6 text-[16px] font-semibold text-white disabled:opacity-50">
            {{ loading ? 'Activation...' : 'Activer' }}
          </button>
        </div>
      </form>
    }
  </div>
</section>
