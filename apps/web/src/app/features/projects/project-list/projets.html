<!-- Hero -->
<app-page-hero
  title="Projets"
  subtitle="Découvrez les projets innovants de la communauté AfriDev Hub, partagez vos réalisations et inspirez-vous des idées des développeurs africains."
/>

<!-- Main section -->
<section class="bg-[#F8FAFC]">
  <div class="mx-auto w-full max-w-[1200px] px-6 py-16 sm:px-10 lg:px-0 lg:py-10">
    <div class="flex flex-col gap-10">
      <!-- Filters -->
      <div class="flex flex-wrap items-center gap-[12px]">
        @for (tag of tags; track tag) {
          <button
            type="button"
            (click)="toggleTag(tag)"
            [class]="
              (selectedTag() === tag
                ? 'bg-[#141219] text-white '
                : 'bg-white text-[#141219] border-[#E2E8F0] ') +
              'rounded-full border px-[16px] py-[4px] text-[16px] font-medium transition-colors'
            "
          >
            {{ tag }}
          </button>
        }
      </div>

      <!-- Cards grid -->
      <div class="grid grid-cols-1 gap-10 md:grid-cols-2 lg:grid-cols-3">
        @for (project of filteredProjects(); track project.title + project.stars + $index) {
          <app-card-projet [project]="project" ctaLabel="Démo" />
        }
      </div>

      <!-- Load more -->
      <div class="flex justify-center">
        <button type="button" class="inline-flex h-14 items-center justify-center gap-2.5 rounded-full border border-ink px-5 text-base font-semibold leading-[26px] text-ink">
          Charger plus
        </button>
      </div>
    </div>
  </div>
</section>
