<nav
  class="fixed top-0 left-0 right-0 z-50 flex justify-center top-3 sm:p-[14px] md:p-[16px] pointer-events-auto w-full max-w-[1000px] mx-auto rounded-[1000px] border border-slate-[#E2E8F029] bg-[#1e1e1e]/90 backdrop-blur-md"
  aria-label="Navigation principale">


  <div class="w-full flex items-center justify-between">
    <a href="#" class="flex shrink-0 items-center" aria-label="AfriDev Hub">
      <img src="assets/images/logo.png" alt="AfriDev Hub" class="w-full h-auto" />
    </a>

    <ul class="hidden items-center lg:flex lg:gap-[23px]">
      @for (item of links; track item.label) {
        <li>
          <a
            [routerLink]="item.link"
            [fragment]="item.fragment"
            class="flex h-[46px] items-center px-4 text-base font-semibold leading-[26px] text-white transition-colors hover:text-white/80"
          >{{ item.label }}</a>
        </li>
      }
    </ul>

    <div class="flex items-center gap-3">
      <a routerLink="/auth/register" class="text-[#0F6932] border border-[#0F6932] rounded-[1000px] px-[20px] py-[14px] text-[16px] font-semibold leading-[26px] transition-colors hover:bg-[#0F6932] hover:text-white">
        Rejoindre
      </a>
      <button
        type="button"
        class="inline-flex size-10 items-center justify-center rounded-full border border-white/15 bg-white/5 text-white transition-colors hover:bg-white/10 lg:hidden"
        (click)="menuOpen.set(!menuOpen())"
        [attr.aria-label]="menuOpen() ? 'Fermer le menu' : 'Ouvrir le menu'"
        [attr.aria-expanded]="menuOpen()"
      >
        @if (menuOpen()) {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-5" aria-hidden="true">
            <path d="M18 6 6 18" />
            <path d="m6 6 12 12" />
          </svg>
        } @else {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" class="size-5" aria-hidden="true">
            <path d="M4 7h16" />
            <path d="M4 12h16" />
            <path d="M4 17h16" />
          </svg>
        }
      </button>
    </div>
  </div>

  @if (menuOpen()) {
    <div class="border-t border-white/10 px-6 py-5 lg:hidden">
      <ul class="flex flex-col gap-4">
        @for (item of links; track item.label) {
          <li>
            <a
              [routerLink]="item.link"
              [fragment]="item.fragment"
              class="text-base font-semibold leading-7 text-white/90 transition-colors hover:text-white"
              (click)="menuOpen.set(false)"
            >{{ item.label }}</a>
          </li>
        }
      </ul>
    </div>
  }
</nav>
